name: Supabase keep-alive

# Supabase の無料プランは、7日間 DB へのアクセスが少ないと一時停止される（設計書 1.2）。
# 練習しない週があっても止まらないよう、3日おきに軽い問い合わせを送る。
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # 未設定のまま成功扱いにすると、止まっていることに気付けない（実際に一時停止した）。失敗させて知らせる
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::GitHub の Secrets に SUPABASE_URL と SUPABASE_PUBLISHABLE_KEY を登録してください（README「同期の設定」5）"
            exit 1
          fi
          curl -fsS "$SUPABASE_URL/rest/v1/allowed_emails?select=email&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -o /dev/null
