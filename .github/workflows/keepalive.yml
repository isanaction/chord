name: Supabase keep-alive

# Supabase の無料プランは、7日間 DB へのアクセスが少ないと一時停止される（設計書 1.2）。
# 練習しない週があっても止まらないよう、3日おきに軽い問い合わせを送る。
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Supabase のシークレットが未設定のため、何もしません"
            exit 0
          fi
          curl -fsS "$SUPABASE_URL/rest/v1/allowed_emails?select=email&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -o /dev/null
