name: Supabase keep-alive

# Supabase の無料プランは、7日間 DB へのアクセスが少ないと一時停止される（設計書 1.2）。
# 練習しない週があっても止まらないよう、3日おきに軽い問い合わせを送る。
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        env:
          # URL と publishable key はブラウザにも配る公開の値なので、本番の値を既定にする。
          # 別のプロジェクトに向けるときは Secrets で上書きする
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://hceczmfxhufuuxkxvmyu.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_DhjZJ2Xa9vCc0ESwlGcGrg_Y0iVwGvs' }}
        run: |
          curl -fsS "$SUPABASE_URL/rest/v1/allowed_emails?select=email&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -o /dev/null
          echo "Supabase に問い合わせました"
